name: Windows CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate runtime resources
        run: |
          python scripts/generate_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_translations.py
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Qt component tests
        run: python -m unittest discover -s tests/component -v
      - name: TCP serial GUI E2E
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v
      - name: Source startup smoke
        run: python src/main/app_qt.py --smoke-test "$env:RUNNER_TEMP/qserial-source-smoke"
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qserial-source-smoke/
          if-no-files-found: ignore
          retention-days: 7
